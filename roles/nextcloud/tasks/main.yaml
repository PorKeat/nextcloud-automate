---
- name: Ensure nextcloud namespace exists
  shell: "kubectl create namespace {{ helm_namespace }} --dry-run=client -o yaml | kubectl apply -f -"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Transfer Helm values to remote server
  template:
    src: values.yaml.j2
    dest: /tmp/nextcloud_values.yaml

- name: Deploy Nextcloud via Helm
  command: "helm upgrade --install {{ helm_release_name }} nextcloud/nextcloud --namespace {{ helm_namespace }} --version {{ helm_chart_version }} -f /tmp/nextcloud_values.yaml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: helm_deploy

- name: Display Helm Deploy Output
  debug:
    var: helm_deploy.stdout_lines

- name: Setup Traefik redirect for docs.sengporkeat.com
  template:
    src: docs-redirect.yaml.j2
    dest: /tmp/docs-redirect.yaml

- name: Apply docs redirect
  shell: "kubectl apply -f /tmp/docs-redirect.yaml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Disable and remove the buggy custom app
  shell: |
    POD_NAME=$(kubectl get pod -n {{ helm_namespace }} -l app.kubernetes.io/name=nextcloud -o jsonpath="{.items[0].metadata.name}")
    kubectl exec -n {{ helm_namespace }} $POD_NAME -- su -s /bin/sh www-data -c "php occ app:disable jitsilink || true"
    kubectl exec -n {{ helm_namespace }} $POD_NAME -- rm -rf /var/www/html/custom_apps/jitsilink
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Copy custom apps to remote host
  copy:
    src: "{{ item }}"
    dest: /tmp/
    mode: '0755'
  loop:
    - jitsipro
    - unitydocs

- name: Inject custom apps into Nextcloud Pod
  shell: |
    POD_NAME=$(kubectl get pod -n {{ helm_namespace }} -l app.kubernetes.io/name=nextcloud -o jsonpath="{.items[0].metadata.name}")
    kubectl cp /tmp/jitsipro {{ helm_namespace }}/$POD_NAME:/var/www/html/custom_apps/
    kubectl cp /tmp/unitydocs {{ helm_namespace }}/$POD_NAME:/var/www/html/custom_apps/
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Enable custom apps and upgrade database
  shell: |
    POD_NAME=$(kubectl get pod -n {{ helm_namespace }} -l app.kubernetes.io/name=nextcloud -o jsonpath="{.items[0].metadata.name}")
    kubectl exec -n {{ helm_namespace }} $POD_NAME -- su -s /bin/sh www-data -c "php occ app:enable jitsipro"
    kubectl exec -n {{ helm_namespace }} $POD_NAME -- su -s /bin/sh www-data -c "php occ app:enable unitydocs"
    kubectl exec -n {{ helm_namespace }} $POD_NAME -- su -s /bin/sh www-data -c "php occ upgrade || true"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Restart Nextcloud Pod to clear PHP Opcache
  shell: |
    kubectl delete pod -n {{ helm_namespace }} -l app.kubernetes.io/name=nextcloud
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
