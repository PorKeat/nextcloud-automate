---
- name: Destroy Nextcloud Stateless Architecture
  hosts: k3s_cluster
  gather_facts: false

  tasks:
    - name: Uninstall Nextcloud via Helm on remote server
      command: "helm uninstall {{ helm_release_name }} --namespace {{ helm_namespace }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true
